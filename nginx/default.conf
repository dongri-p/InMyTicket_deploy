# 80으로 오면 전부 HTTPS 도메인으로 보낸다 (IP로 접속해도 도메인으로 이동)
server {
    listen 80;
    server_name _;
    return 301 https://inmyticket.duckdns.org$request_uri;
}

server {
    listen 443 ssl;
    server_name inmyticket.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/inmyticket.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inmyticket.duckdns.org/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # 도커 내장 DNS. proxy_pass에 변수를 쓰면 nginx가 기동 시점에 한 번만 조회해 캐시하지 않고
    # 요청 시점에 다시 조회하므로, backend 컨테이너가 재생성돼 내부 IP가 바뀌어도 502가 나지 않음
    resolver 127.0.0.11 valid=10s;

    # API 요청은 내부 네트워크로 백엔드에 전달 (리버스 프록시)
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html은 매번 서버에 새 버전인지 확인 (캐시돼 있으면 배포 직후에도 옛 화면이 뜸).
    # SPA 경로(/performances/1 등)도 아래 try_files로 /index.html에 내부 이동하므로 여기에 걸림
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Vite 빌드 결과물은 파일명에 내용 해시가 붙어 내용이 바뀌면 이름도 바뀜 → 1년 캐시해도 안전
    location /assets/ {
        # always를 안 붙여 200/304에만 붙임 (없는 파일의 404까지 1년 캐시되지 않게)
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 나머지는 React SPA 라우팅
    location / {
        try_files $uri $uri/ /index.html;
    }
}
