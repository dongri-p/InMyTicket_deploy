# 80으로 오면 전부 HTTPS 도메인으로 보낸다 (IP로 접속해도 도메인으로 이동)
server {
    listen 80;
    server_name _;
    return 301 https://inmyticket.duckdns.org$request_uri;
}

server {
    listen 443 ssl;
    server_name inmyticket.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/inmyticket.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inmyticket.duckdns.org/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # API 요청은 내부 네트워크로 백엔드에 전달 (리버스 프록시)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 나머지는 React SPA 라우팅
    location / {
        try_files $uri $uri/ /index.html;
    }
}
