services:
  backend:
    build: ../backend
    # 외부 포트는 열지 않는다. API는 frontend(nginx)의 /api/ 프록시로만 들어온다.
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/inmyticket?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      - DB_USERNAME=appuser
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_LOGIN_ID=${ADMIN_LOGIN_ID}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - KOPIS_API_KEY=${KOPIS_API_KEY}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    depends_on:
      - db
    restart: always

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    restart: always

  db:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=inmyticket
      - MYSQL_USER=appuser
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    restart: always

volumes:
  db_data: